name: Release

on:
  push:
    branches: [main, "release/**"]
    # Only merges that add a changeset or change a package manifest, which every
    # Version Packages PR does. Other merges have nothing to version or release.
    paths: [".changeset/**", "packages/*/package.json"]

# No workflow-wide concurrency: a run waiting for an approval would otherwise
# hold back every later run on the branch, versioning included. Each job that
# writes or publishes has its own group instead. A group runs one job at a time
# and keeps only the newest waiting one, which is enough, as each run releases
# everything on its branch up to its commit.

# No permissions by default; each job asks for only what it needs.
#
# The jobs split the work by what it needs:
#   version            Version Packages PR, tags, GitHub Releases   repo + PR write
#   build              builds dist/ and the .vsix                   read only
#   publish-npm        publishes to npm                             id-token, environment
#   publish-extension  publishes to Marketplace and Open VSX        id-token, environment
# Each publish job runs in the GitHub environment of the same name.
# No job can both write to the repository and mint a publish token. The publish
# jobs run no build and no install script: just the publishing tool, from the
# lockfile, on what build made.
permissions: {}

jobs:
  # On a feature merge: opens or updates the "Version Packages" PR against the
  # pushed branch (main, or a release/<line> maintenance branch). On the merge
  # of that PR no changesets are left, so the action runs `changeset git-tag` in
  # place of a publish: it tags every package version with no tag on GitHub yet
  # (`<name>@<version>`, the extension too), pushes those tags and creates a
  # GitHub Release for each from its changelog entry. The jobs below release it.
  version:
    runs-on: ubuntu-latest
    concurrency:
      group: release-version-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # "false" on the merge of a Version Packages PR: CI makes that PR consume
      # every changeset. The jobs below run only then.
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: no dependency install script runs in a job that can
      # write to the repository.
      - run: npm ci --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npm run version
          publish-script: npx changeset git-tag
      # A Version Packages merge with changesets pending would release nothing.
      # CI and up-to-date checks should prevent it; if not, fail rather than go green.
      - if: steps.changesets.outputs.has-changesets == 'true' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/changeset-release/')
        run: |
          echo "::error::This Version Packages merge released nothing: changesets are still pending. Merge the updated Version Packages PR to release."
          exit 1

  # Builds what is released, with no secrets and no id-token, so nothing in
  # npm ci or the build can publish. Hands dist/ of the npm packages to
  # publish-npm and, on main, the .vsix to publish-extension. Also says which
  # manifests this commit changed, so a release asks for approval only for the
  # registries it bumps; a re-run checks the same commit, so gets the same answer.
  build:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      npm: ${{ steps.bumped.outputs.npm }}
      extension: ${{ steps.bumped.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # base is this branch: compare with the commit before this push.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: bumped
        with:
          base: ${{ github.ref_name }}
          filters: |
            npm: packages/!(vscode)/package.json
            extension: packages/vscode/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: they could otherwise alter what is published.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # @anweba/glugent-schemas has no build: it publishes the committed JSON files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: |
            packages/core/dist
            packages/cli/dist
            !packages/*/dist/test
          if-no-files-found: error
          retention-days: 30  # an approval can wait up to 30 days
      - if: github.ref_name == 'main'
        run: npm run package -w glugent-vscode
      - if: github.ref_name == 'main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/vscode/glugent-vscode-*.vsix
          if-no-files-found: error
          retention-days: 30  # an approval can wait up to 30 days

  # Publishes to npm the dist/ that build made. npm trusted publishing: the job
  # exchanges its OIDC identity for a short-lived publish token, so no NPM_TOKEN
  # is stored; the trusted publisher on npm is registered for this workflow and
  # the "publish-npm" environment (main and release/** may use it). It cannot
  # write to the repository: version made the tags (--no-git-tag).
  # Skipped when the release bumps no npm package (only the extension).
  publish-npm:
    needs: build
    if: needs.build.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment: publish-npm
    concurrency:
      group: release-npm-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm >= 11.5.1 (ships with Node 24), so .nvmrc must stay >= 24.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: packages
      # Publishes each package whose version is not on npm yet. It runs no build:
      # the packages have no prepublish/prepack/prepare scripts. Releases from
      # release/** branches publish under the "maintenance" dist-tag so an old
      # line never becomes `latest`.
      - if: github.ref_name == 'main'
        run: npx changeset publish --no-git-tag
      - if: github.ref_name != 'main'
        run: npx changeset publish --no-git-tag --tag maintenance

  # Publishes the .vsix that build made to the VS Code Marketplace and Open VSX,
  # alongside publish-npm. Runs only on main: the extension stores have one version line, so
  # an old maintenance line must never publish there. It runs in the
  # "publish-extension" environment, which only main may use. Both registries
  # use trusted publishing (OIDC, registered for this workflow and environment),
  # so no publish token is stored.
  # Skipped when the release does not bump the extension. --skip-duplicate makes
  # a re-run after a partial publish skip the store that already has the version.
  publish-extension:
    needs: build
    if: github.ref_name == 'main' && needs.build.outputs.extension == 'true'
    runs-on: ubuntu-latest
    environment: publish-extension
    # One extension publish at a time; waiting for approval holds back only the
    # next extension publish, which then publishes the newer .vsix.
    concurrency:
      group: release-extension-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: packages/vscode
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        run: npx vsce publish --packagePath glugent-vscode-*.vsix --oidc --skip-duplicate
      - name: Publish to Open VSX
        working-directory: packages/vscode
        run: npx ovsx publish glugent-vscode-*.vsix --trusted-publishing --skip-duplicate
