name: Release

on:
  push:
    branches: [main, "release/**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No permissions by default; each job asks for only what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: the job exchanges its OIDC identity for a
      # short-lived npm publish token, so no NPM_TOKEN secret is stored.
      id-token: write
    outputs:
      # "false" once every changeset is consumed: the push is the merge of a
      # Version Packages PR (or has nothing to release), not a feature merge.
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm >= 11.5.1 (ships with Node 24).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # --ignore-scripts: no dependency install script runs in a job that can
      # mint an npm publish token or write to the repository.
      - run: npm ci --ignore-scripts
      # Opens/updates the "Version Packages" PR against the pushed branch
      # (main, or a release/<line> maintenance branch). Merging it publishes
      # to npm, tags the release and creates GitHub Releases from the
      # changelog entries.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v1 (v1.9.0)
        id: changesets
        with:
          version: npm run version
          # Releases from release/** branches publish under the "maintenance"
          # dist-tag so an old line never becomes `latest`.
          publish: ${{ github.ref_name == 'main' && 'npm run release' || 'npm run release:maintenance' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the VS Code extension to the VS Code Marketplace and Open VSX.
  # Runs only on main, after the Version Packages PR is merged. Its tokens
  # live in the "Release" environment, which only main may use, and are given
  # to the publish step alone, not to npm ci or the build. --skip-duplicate
  # turns a release that did not bump the extension into a no-op.
  publish-extension:
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No install scripts: they could otherwise alter the .vsix before it is published.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run package -w glugent-vscode
      - name: Publish to the VS Code Marketplace and Open VSX
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix=$(ls glugent-vscode-*.vsix)
          npx vsce publish --packagePath "$vsix" --skip-duplicate
          npx ovsx publish "$vsix" --skip-duplicate
