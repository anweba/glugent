name: Release

on:
  push:
    branches: [main, "release/**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No permissions by default; each job asks for only what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: the job exchanges its OIDC identity for a
      # short-lived npm publish token, so no NPM_TOKEN secret is stored.
      id-token: write
    outputs:
      # "false" once every changeset is consumed: the push is the merge of a
      # Version Packages PR (or has nothing to release), not a feature merge.
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs npm >= 11.5.1 (ships with Node 24), so .nvmrc must stay >= 24.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # --ignore-scripts: no dependency install script runs in a job that can
      # mint an npm publish token or write to the repository.
      - run: npm ci --ignore-scripts
      # Opens/updates the "Version Packages" PR against the pushed branch
      # (main, or a release/<line> maintenance branch). Merging it publishes
      # to npm, tags the release and creates GitHub Releases from the
      # changelog entries.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 (v1.9.0)
        id: changesets
        with:
          version: npm run version
          # Releases from release/** branches publish under the "maintenance"
          # dist-tag so an old line never becomes `latest`.
          publish: ${{ github.ref_name == 'main' && 'npm run release' || 'npm run release:maintenance' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the VS Code extension. Runs only on main, after the Version Packages
  # PR is merged. It has no secrets and no id-token, so nothing in npm ci or the
  # build can publish; it hands the .vsix to publish-extension.
  package-extension:
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: they could otherwise alter the .vsix before it is published.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run package -w glugent-vscode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: packages/vscode/glugent-vscode-*.vsix
          if-no-files-found: error
          retention-days: 1

  # Publishes the built .vsix to the VS Code Marketplace and Open VSX. It runs
  # in the "Release" environment, which only main may use and which waits for
  # approval. Both registries use trusted publishing (OIDC, registered for this
  # workflow and environment), so no publish token is stored. This job builds nothing and
  # installs without scripts, so no code but vsce and ovsx (from the lockfile)
  # runs where id-token is granted.
  # --skip-duplicate turns a release that did not bump the extension into a no-op.
  publish-extension:
    needs: package-extension
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: packages/vscode
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        run: npx vsce publish --packagePath glugent-vscode-*.vsix --oidc --skip-duplicate
      - name: Publish to Open VSX
        working-directory: packages/vscode
        run: npx ovsx publish glugent-vscode-*.vsix --trusted-publishing --skip-duplicate
