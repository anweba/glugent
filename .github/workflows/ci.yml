name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every LTS line from engines.node (>=22) up; .nvmrc is what development and releases use.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # The same checks as `npm run verify`, which the pre-push hook runs; keep the two in step.
      - run: npm run build
      - run: npm test
      # README.md and CONTRIBUTING.md are built from .glugent (npm run docs:build); fail if they were edited by hand.
      - run: npm run docs:check
      # Each example's output/ is committed so it can be read on GitHub; fail if it is stale,
      # missing, or has files no target writes any more (fix with npm run examples:build).
      - run: npm run examples:check
      # Pull requests that touch a package need a changeset (npm run changeset).
      # The Version Packages PR is exempt: it consumes the changesets.
      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: npx changeset status --since=origin/${{ github.base_ref }}
      # The Version Packages PR must have consumed every changeset, including any that
      # reached it by merging the base branch in, so merging it releases everything pending.
      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'changeset-release/')
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Changesets not versioned yet; wait for the Release workflow to update this PR:"
            echo "$pending"
            exit 1
          fi
