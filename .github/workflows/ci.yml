name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Pull requests that touch a package need a changeset (npm run changeset).
      - if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/${{ github.base_ref }}
