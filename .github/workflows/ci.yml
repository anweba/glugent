name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # README.md and CONTRIBUTING.md are built from glugent-agents (npm run docs:build); fail if they were edited by hand.
      - run: npm run docs:build
      - run: git diff --exit-code README.md CONTRIBUTING.md
      # Each example's output/ is committed so it can be read on GitHub; fail if it is stale,
      # missing, or has files no target writes any more.
      - run: npm run examples:build
      - run: |
          if [ -n "$(git status --porcelain examples)" ]; then
            echo "::error::examples/*/output is out of date; run npm run examples:build and commit the result"
            git status --short examples
            exit 1
          fi
      # Pull requests that touch a package need a changeset (npm run changeset).
      # The Version Packages PR is exempt: it consumes the changesets.
      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: npx changeset status --since=origin/${{ github.base_ref }}
      # The Version Packages PR must have consumed every changeset, including any that
      # reached it by merging the base branch in, so merging it releases everything pending.
      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'changeset-release/')
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Changesets not versioned yet; wait for the Release workflow to update this PR:"
            echo "$pending"
            exit 1
          fi
